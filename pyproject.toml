
[project]
name = "raft"
version = "0.3.0"
description = "Implementation of raft in python"
authors = [{ "name" = "Erik Aker", "email" = "eraker@gmail.com" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Typing :: Typed",
]
dependencies = [
    "rich >= 14.1.0",
    "trio >= 0.31.0"
]

[project.urls]
Documentation = "https://erewok.github.io/raft-py/"
Repository = "https://github.com/erewok/raft-py"
Issues = "https://github.com/erewok/raft-py"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mypy>=1.0.1",
    "pytest-trio>=0.8.0",
    "ruff>=0.13.0",
    # Documentation dependencies
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.6.20",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
]

[build-system]
requires = ["setuptools", "versioningit"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
trio_mode = true
minversion = "8.3"
pythonpath = "."
xfail_strict = true
addopts = "--cov-report=term-missing:skip-covered --cov=raft --strict-config --strict-markers --cov-report html"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.coverage.run]
omit = [
    "__main__.py",
    # omit tracing.py and run
    "*/tracing.py",
]

[tool.ruff]
src = ["boilermaker", "tests"]
fix = true
show-fixes = true
output-format = "full"
line-length = 110

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # pyflakes
    "FA", # flake8-future-annotations
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "W",  # pycodestyle warning
]
ignore = ["N818", "N805"] # exception naming

[tool.ruff.lint.isort]
force-single-line = false
order-by-type = false